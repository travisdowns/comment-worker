# The name of your Worker. Alphanumeric values and dashes only.
name = "comment-worker"

# The entrypoint/path to the file that will be executed.
main = "./src/index.js"

# Whether you use `<NAME>.<SUBDOMAIN>.workers.dev` to
# test and deploy your Worker.
# @default `true`
workers_dev = true

# A date in the form yyyy-mm-dd, which will be used to determine
# which version of the Workers runtime is used.
compatibility_date = "2023-08-11"

# Secrets are set with `wrangler secret put`, never here:
#   GITHUB_TOKEN (or GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY), TURNSTILE_SECRET_KEY
[vars]
GITHUB_ORGANIZATION_SLUG = "travisdowns"
GITHUB_REPOSITORY_SLUG = "travisdowns.github.io"
GITHUB_REPOSITORY_BRANCH = "master"
CW_ALLOWED_ORIGINS = "https://travisdowns.github.io"